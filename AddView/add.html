<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="add.css"> <!-- Puedes agregar tu CSS aquí -->
    <title>Yu-Gi-Oh - Add Cards</title>
</head>

<body>
    <!-- Barra de búsqueda con filtro -->
    <section class="section-search">
        <nav class="nav-search">
            <button id="filter-btn">🔽</button>
            <input type="text" placeholder="Buscar cualquier carta" id="search-input">
            <button id="search-btn">🔍</button>
        </nav>
    </section>

    <aside id="filter-panel">
        <button id="filter-close-btn" aria-label="Cerrar filtros">Atrás</button>
        <button id="clear-filters-btn" type="button">Limpiar</button>

        <br>
        <h3>Tipos de Cartas</h3>
        <!-- Radio buttons de categoría -->
        <label><input type="radio" name="category" value="Monster" class="category-radio"> Monstruos</label><br>
        <label><input type="radio" name="category" value="Spell" class="category-radio"> Magias</label><br>
        <label><input type="radio" name="category" value="Trap" class="category-radio"> Trampas</label>

        <br><br>
        <hr>
        <h4>Magias</h4>
        <label><input type="checkbox" value="Normal Spell" class="spell-checkbox"> Normal</label><br>
        <label><input type="checkbox" value="Quick-Play Spell" class="spell-checkbox"> Quick-Play</label><br>
        <label><input type="checkbox" value="Field Spell" class="spell-checkbox"> Field</label><br>
        <label><input type="checkbox" value="Continuous Spell" class="spell-checkbox"> Continuous</label><br>
        <label><input type="checkbox" value="Equip Spell" class="spell-checkbox"> Equip</label><br>
        <label><input type="checkbox" value="Ritual Spell" class="spell-checkbox"> Ritual</label>

        <br><br>
        <hr>
        <h4>Trampas</h4>
        <label><input type="checkbox" value="Normal Trap" class="trap-checkbox"> Normal</label><br>
        <label><input type="checkbox" value="Counter Trap" class="trap-checkbox"> Counter</label><br>
        <label><input type="checkbox" value="Continuous Trap" class="trap-checkbox"> Continuous</label>

        <br><br>
        <hr>
        <h4>Monstruos</h4>
        <label><input type="checkbox" value="Normal Monster" class="monster-checkbox"> Normal</label><br>
        <label><input type="checkbox" value="Effect Monster" class="monster-checkbox"> Effect</label><br>
        <label><input type="checkbox" value="Fusion Effect Monster" class="monster-checkbox"> Fusion</label><br>
        <label><input type="checkbox" value="Synchro Effect Monster" class="monster-checkbox"> Synchro</label><br>
        <label><input type="checkbox" value="Xyz Effect Monster" class="monster-checkbox"> Xyz</label><br>
        <label><input type="checkbox" value="Pendulum Effect Monster" class="monster-checkbox"> Pendulum</label><br>
        <label><input type="checkbox" value="Link Effect Monster" class="monster-checkbox"> Link</label><br>
        <label><input type="checkbox" value="Ritual Effect Monster" class="monster-checkbox"> Ritual</label><br>
        <label><input type="checkbox" value="Tuner Effect Monster" class="monster-checkbox"> Tuner</label><br>
        <label><input type="checkbox" value="Gemini Effect Monster" class="monster-checkbox"> Gemini</label><br>
        <label><input type="checkbox" value="Union Effect Monster" class="monster-checkbox"> Union</label><br>
        <label><input type="checkbox" value="Spirit Effect Monster" class="monster-checkbox"> Spirit</label><br>
        <label><input type="checkbox" value="Flip Effect Monster" class="monster-checkbox"> Flip</label><br>
        <label><input type="checkbox" value="Toon Effect Monster" class="monster-checkbox"> Toon</label><br>
    </aside>


    <main>
        <!-- Listado de cartas en stock -->
        <section class="card-list">

            <ul id="lista-cartas">
                <!-- Cada carta -->
            </ul>

            <div id="mensaje-agregado" role="alert">
                Carta agregada al stock
            </div>

        </section>
    </main>

    <!-- Menú de navegación inferior -->
    <footer class="footer-menu">
        <a id="add-card-btn" class="active" href="../AddView/add.html">➕</a>
        <a id="home-btn" href="../HomeView/index.html">🏠</a>
        <a id="banned-cards-btn" href="../ForbiddenView/forbidden.html">🚫</a>
    </footer>

    <script type="module" src="./add.js"></script>
</body>

</html>
